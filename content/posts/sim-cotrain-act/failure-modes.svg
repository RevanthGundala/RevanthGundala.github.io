<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 205" width="100%" role="img" aria-label="Outcome of all 240 six-seed trials: real-only 52 successes, 36 never closed gripper, 25 closed on empty air, 7 failed at pad; co-trained 71 successes, 19 never closed, 19 closed on empty air, 11 failed at pad">
  <style>
    .t { font-family: inherit; fill: var(--text); font-size: 16.5px; }
    .m { font-family: inherit; fill: var(--text-muted); font-size: 13.5px; }
    .n { font-family: inherit; fill: var(--bg); font-size: 14.5px; font-weight: 700; text-anchor: middle; }
    .nd { font-family: inherit; fill: #1f1e1d; font-size: 14.5px; font-weight: 700; text-anchor: middle; }
    .ok { fill: var(--accent); }
    .nc { fill: #d97757; }
    .ec { fill: #e9b9a3; }
    .dr { fill: var(--text-muted); opacity: 0.72; }
  </style>

  <!-- legend -->
  <rect class="ok" x="120" y="12" width="13" height="13" rx="3"/><text class="m" x="139" y="23">Success</text>
  <rect class="nc" x="218" y="12" width="13" height="13" rx="3"/><text class="m" x="237" y="23">Never closed gripper</text>
  <rect class="ec" x="392" y="12" width="13" height="13" rx="3"/><text class="m" x="411" y="23">Closed on empty air</text>
  <rect class="dr" x="562" y="12" width="13" height="13" rx="3"/><text class="m" x="581" y="23">Grasped, missed pad</text>

  <!-- Real-only (120 trials): 52*4.5=234, 36*4.5=162, 25*4.5=112.5, 7*4.5=31.5 -->
  <text class="t" x="0" y="78">Real-only ACT</text>
  <text class="m" x="0" y="97">120 trials (6 seeds)</text>
  <rect class="ok" x="200" y="62" width="234" height="36" rx="4"/><text class="n" x="317" y="85">52</text>
  <rect class="nc" x="434" y="62" width="162" height="36" rx="4"/><text class="n" x="515" y="85">36</text>
  <rect class="ec" x="596" y="62" width="112.5" height="36" rx="4"/><text class="nd" x="652.2" y="85">25</text>
  <rect class="dr" x="708.5" y="62" width="31.5" height="36" rx="4"/><text class="n" x="724.2" y="85">7</text>

  <!-- Co-trained (120 trials): 71*4.5=319.5, 19*4.5=85.5, 19*4.5=85.5, 11*4.5=49.5 -->
  <text class="t" x="0" y="150">Co-trained ACT</text>
  <text class="m" x="0" y="169">120 trials (6 seeds)</text>
  <rect class="ok" x="200" y="134" width="319.5" height="36" rx="4"/><text class="n" x="359.8" y="157">71</text>
  <rect class="nc" x="519.5" y="134" width="85.5" height="36" rx="4"/><text class="n" x="562.2" y="157">19</text>
  <rect class="ec" x="605" y="134" width="85.5" height="36" rx="4"/><text class="nd" x="647.8" y="157">19</text>
  <rect class="dr" x="690.5" y="134" width="49.5" height="36" rx="4"/><text class="n" x="715.2" y="157">11</text>
</svg>
