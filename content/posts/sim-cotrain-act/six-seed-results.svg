<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="100%" role="img" aria-label="Six-seed paired evaluation on 20 real placements: real-only ACT mean 43.3% versus stitched-1k co-trained ACT mean 59.2%, paired p = 0.21, showing individual seed pairs 1001 through 1006">
  <style>
    .t { font-family: inherit; fill: var(--text); font-size: 16.5px; }
    .m { font-family: inherit; fill: var(--text-muted); font-size: 13.5px; }
    .grid { stroke: var(--border); stroke-width: 1; }
    .ceil { stroke: var(--text-muted); stroke-width: 1.2; stroke-dasharray: 4 4; opacity: 0.65; }
    .ci { stroke-width: 3; stroke-linecap: round; }
    .link { stroke: var(--border); stroke-width: 2.2; }
    .linkbad { stroke: #d97757; stroke-width: 2.2; }
    .base { stroke: var(--text-muted); fill: var(--text-muted); }
    .cot { stroke: var(--accent); fill: var(--accent); }
    .bad { stroke: #d97757; fill: #d97757; }
    .dot { stroke: var(--bg); stroke-width: 2.5; }
    .diffpos { font-family: inherit; fill: var(--accent); font-size: 13.5px; font-weight: 600; }
    .diffneg { font-family: inherit; fill: #d97757; font-size: 13.5px; font-weight: 600; }
    .diffneu { font-family: inherit; fill: var(--text-muted); font-size: 13.5px; font-weight: 600; }
  </style>

  <!-- gridlines: x(p) = 210 + 4.8 * p -->
  <g class="grid">
    <line x1="210" y1="26" x2="210" y2="424"/>
    <line x1="330" y1="26" x2="330" y2="424"/>
    <line x1="450" y1="26" x2="450" y2="424"/>
    <line x1="570" y1="26" x2="570" y2="424"/>
    <line x1="690" y1="26" x2="690" y2="424"/>
  </g>

  <!-- Real-only ceiling 55% (11/20) -> x = 474 -->
  <line class="ceil" x1="474" y1="168" x2="474" y2="424"/>
  <text class="m" x="474" y="160" text-anchor="middle" style="font-size:12px;">Real-only max (11/20)</text>

  <!-- Cohort means (top) -->
  <text class="t" x="0" y="54">Real-only ACT</text>
  <text class="m" x="0" y="73">6 seeds, 50 real demos</text>
  <line class="ci base" x1="368.4" y1="62" x2="467.8" y2="62"/>
  <circle class="dot base" cx="418.0" cy="62" r="8.5"/>
  <text class="t" x="482" y="68">43.3%</text>
  <text class="m" x="536" y="68">52/120</text>

  <text class="t" x="0" y="106">Co-trained ACT</text>
  <text class="m" x="0" y="125">6 seeds, +1,000 sim</text>
  <line class="ci cot" x1="386.6" y1="114" x2="601.2" y2="114"/>
  <circle class="dot cot" cx="494.0" cy="114" r="8.5"/>
  <text class="t" x="614" y="120">59.2%</text>
  <text class="m" x="668" y="120">71/120</text>

  <line class="grid" x1="0" y1="142" x2="755" y2="142"/>

  <!-- Per-seed rows: x(k) = 210 + 24 * k -->
  <!-- Seed 1001: Real 7 (378) -> Cot 16 (594) -->
  <text class="t" x="0" y="196">Seed 1001</text>
  <line class="link" x1="378" y1="191" x2="594" y2="191"/>
  <circle class="dot base" cx="378" cy="191" r="7.5"/>
  <circle class="dot cot" cx="594" cy="191" r="7.5"/>
  <text class="diffpos" x="706" y="196">+9/20</text>

  <!-- Seed 1002C: Cot 4 (306) <- Real 9 (426) -->
  <text class="t" x="0" y="240">Seed 1002</text>
  <text class="m" x="0" y="257" style="font-size:12px;">uninterrupted</text>
  <line class="linkbad" x1="306" y1="238" x2="426" y2="238"/>
  <circle class="dot base" cx="426" cy="238" r="7.5"/>
  <circle class="dot bad" cx="306" cy="238" r="7.5"/>
  <text class="diffneg" x="706" y="243">−5/20</text>

  <!-- Seed 1003: Real 7 (378) -> Cot 13 (522) -->
  <text class="t" x="0" y="290">Seed 1003</text>
  <line class="link" x1="378" y1="285" x2="522" y2="285"/>
  <circle class="dot base" cx="378" cy="285" r="7.5"/>
  <circle class="dot cot" cx="522" cy="285" r="7.5"/>
  <text class="diffpos" x="706" y="290">+6/20</text>

  <!-- Seed 1004: Real 11 (474), Cot 11 (474) - slight vertical offset so both dots show -->
  <text class="t" x="0" y="335">Seed 1004</text>
  <circle class="dot base" cx="474" cy="326" r="7"/>
  <circle class="dot cot" cx="474" cy="336" r="7"/>
  <text class="diffneu" x="706" y="335">0/20</text>

  <!-- Seed 1005: Real 11 (474) -> Cot 12 (498) -->
  <text class="t" x="0" y="380">Seed 1005</text>
  <line class="link" x1="474" y1="375" x2="498" y2="375"/>
  <circle class="dot base" cx="474" cy="375" r="7.5"/>
  <circle class="dot cot" cx="498" cy="375" r="7.5"/>
  <text class="diffpos" x="706" y="380">+1/20</text>

  <!-- Seed 1006: Real 7 (378) -> Cot 15 (570) -->
  <text class="t" x="0" y="420">Seed 1006</text>
  <line class="link" x1="378" y1="415" x2="570" y2="415"/>
  <circle class="dot base" cx="378" cy="415" r="7.5"/>
  <circle class="dot cot" cx="570" cy="415" r="7.5"/>
  <text class="diffpos" x="706" y="420">+8/20</text>

  <g class="m" text-anchor="middle">
    <text x="210" y="450">0%</text>
    <text x="330" y="450">25%</text>
    <text x="450" y="450">50%</text>
    <text x="570" y="450">75%</text>
    <text x="690" y="450">100%</text>
  </g>
</svg>
