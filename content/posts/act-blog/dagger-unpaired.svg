<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 185" width="100%" role="img" aria-label="Earlier unpaired comparison: base ACT 27% (4 of 15), ACT with DAgger 60% (9 of 15), with 95% confidence intervals">
  <style>
    .t { font-family: inherit; fill: var(--text); font-size: 17px; }
    .m { font-family: inherit; fill: var(--text-muted); font-size: 14px; }
    .grid { stroke: var(--border); stroke-width: 1; }
    .ci { stroke-width: 3; stroke-linecap: round; }
    .base { stroke: var(--text-muted); fill: var(--text-muted); }
    .dag { stroke: var(--accent); fill: var(--accent); }
    .dot { stroke: var(--bg); stroke-width: 3; }
  </style>
  <g class="grid">
    <line x1="200" y1="25" x2="200" y2="125"/>
    <line x1="330" y1="25" x2="330" y2="125"/>
    <line x1="460" y1="25" x2="460" y2="125"/>
    <line x1="590" y1="25" x2="590" y2="125"/>
    <line x1="720" y1="25" x2="720" y2="125"/>
  </g>
  <g class="m" text-anchor="middle">
    <text x="200" y="150">0%</text>
    <text x="330" y="150">25%</text>
    <text x="460" y="150">50%</text>
    <text x="590" y="150">75%</text>
    <text x="720" y="150">100%</text>
  </g>

  <text class="t" x="0" y="61">Base ACT</text>
  <text class="m" x="0" y="81">48 demonstrations</text>
  <line class="ci base" x1="256.7" y1="71" x2="470.4" y2="71"/>
  <circle class="dot base" cx="338.8" cy="71" r="9"/>
  <text class="t" x="488" y="77">27%</text>
  <text class="m" x="528" y="77">4/15</text>

  <text class="t" x="0" y="106">ACT + DAgger</text>
  <text class="m" x="0" y="126">+18 corrections</text>
  <line class="ci dag" x1="385.6" y1="116" x2="617" y2="116"/>
  <circle class="dot dag" cx="512" cy="116" r="9"/>
  <text class="t" x="635" y="122">60%</text>
  <text class="m" x="675" y="122">9/15</text>
</svg>
