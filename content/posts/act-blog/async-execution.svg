<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 795 225" width="100%" role="img" aria-label="Asynchronous execution timeline showing background model inference running at 10 Hz while robot hardware executes at 30 Hz without pauses">
  <style>
    .t { font-family: inherit; fill: var(--text); font-size: 15px; font-weight: 600; }
    .m { font-family: inherit; fill: var(--text-muted); font-size: 12.5px; }
    .s { font-family: inherit; fill: var(--text); font-size: 11.5px; }
    .box-model { fill: var(--accent-light); stroke: var(--accent); stroke-width: 1.5; rx: 6px; }
    .box-robot { fill: var(--border); stroke: var(--text-muted); stroke-width: 1.5; rx: 6px; }
    .blend { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 4 3; }
    .arrow { stroke: var(--accent); stroke-width: 2; marker-end: url(#arr); fill: none; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--accent)"/>
    </marker>
  </defs>

  <!-- Track 1: Model Planning -->
  <text class="t" x="16" y="45">Model (Background, ~10 Hz)</text>
  <text class="m" x="16" y="65">Predicts 30-action chunk in ~100 ms</text>

  <!-- Model boxes -->
  <g transform="translate(250, 25)">
    <rect class="box-model" x="0" y="0" width="156" height="42"/>
    <text class="s" x="78" y="25" text-anchor="middle" font-weight="600">Predict Chunk 1</text>

    <rect class="box-model" x="168" y="0" width="156" height="42"/>
    <text class="s" x="246" y="25" text-anchor="middle" font-weight="600">Predict Chunk 2</text>

    <rect class="box-model" x="336" y="0" width="156" height="42"/>
    <text class="s" x="414" y="25" text-anchor="middle" font-weight="600">Predict Chunk 3</text>
  </g>

  <!-- Handoff Arrows from Model to Robot -->
  <path class="arrow" d="M 406 70 L 420 120"/>
  <path class="arrow" d="M 574 70 L 588 120"/>

  <!-- Track 2: Robot Execution -->
  <text class="t" x="16" y="145">Robot Arm (Hardware, 30 Hz)</text>
  <text class="m" x="16" y="165">Continuous motion, no pauses</text>

  <!-- Robot execution stream -->
  <g transform="translate(250, 125)">
    <!-- Chunk 1 executed -->
    <rect class="box-robot" x="0" y="0" width="158" height="44"/>
    <text class="s" x="79" y="26" text-anchor="middle">Execute actions (Chunk 1)</text>

    <!-- Chunk 2 blended and executed -->
    <rect class="box-robot" x="168" y="0" width="158" height="44"/>
    <text class="s" x="247" y="26" text-anchor="middle">Blend &amp; execute (Chunk 2)</text>

    <!-- Chunk 3 blended and executed -->
    <rect class="box-robot" x="336" y="0" width="158" height="44"/>
    <text class="s" x="415" y="26" text-anchor="middle">Blend &amp; execute (Chunk 3)</text>
  </g>

  <!-- Timeline axis -->
  <line x1="250" y1="195" x2="735" y2="195" stroke="var(--border)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="m" x="745" y="199">Time</text>
  <text class="m" x="250" y="212">0 ms</text>
  <text class="m" x="418" y="212">~100 ms</text>
  <text class="m" x="586" y="212">~200 ms</text>
</svg>