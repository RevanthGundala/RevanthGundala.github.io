<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="100%" role="img" aria-label="Live success over 30 matched placements with 95% confidence intervals: base 50%, DAgger round 1 63%, DAgger round 2 67%">
  <style>
    .t { font-family: inherit; fill: var(--text); font-size: 17px; }
    .m { font-family: inherit; fill: var(--text-muted); font-size: 14px; }
    .grid { stroke: var(--border); stroke-width: 1; }
    .ci { stroke-width: 3; stroke-linecap: round; }
    .base { stroke: var(--text-muted); fill: var(--text-muted); }
    .dag { stroke: var(--accent); fill: var(--accent); }
    .dot { stroke: var(--bg); stroke-width: 3; }
  </style>

  <!-- gridlines and axis: x(p) = 200 + 5.2 * p -->
  <g class="grid">
    <line x1="200" y1="30" x2="200" y2="200"/>
    <line x1="330" y1="30" x2="330" y2="200"/>
    <line x1="460" y1="30" x2="460" y2="200"/>
    <line x1="590" y1="30" x2="590" y2="200"/>
    <line x1="720" y1="30" x2="720" y2="200"/>
  </g>
  <g class="m" text-anchor="middle">
    <text x="200" y="224">0%</text>
    <text x="330" y="224">25%</text>
    <text x="460" y="224">50%</text>
    <text x="590" y="224">75%</text>
    <text x="720" y="224">100%</text>
  </g>

  <!-- Base: 15/30, CI 33-67 -->
  <text class="t" x="0" y="76">Base</text>
  <text class="m" x="0" y="96">no DAgger</text>
  <line class="ci base" x1="371.6" y1="86" x2="548.4" y2="86"/>
  <circle class="dot base" cx="460" cy="86" r="9"/>
  <text class="t" x="566" y="92">50%</text>
  <text class="m" x="606" y="92">15/30</text>

  <!-- DAgger round 1: 19/30, CI 46-78 -->
  <text class="t" x="0" y="131">DAgger, round 1</text>
  <text class="m" x="0" y="151">18 corrections</text>
  <line class="ci dag" x1="439.2" y1="141" x2="605.6" y2="141"/>
  <circle class="dot dag" cx="527.6" cy="141" r="9"/>
  <text class="t" x="623" y="147">63%</text>
  <text class="m" x="663" y="147">19/30</text>

  <!-- DAgger round 2: 20/30, CI 49-81 -->
  <text class="t" x="0" y="186">DAgger, round 2</text>
  <text class="m" x="0" y="206">+12 targeted</text>
  <line class="ci dag" x1="454.8" y1="196" x2="621.2" y2="196"/>
  <circle class="dot dag" cx="548.4" cy="196" r="9"/>
  <text class="t" x="638" y="202" >67%</text>
  <text class="m" x="678" y="202">20/30</text>

  </svg>
