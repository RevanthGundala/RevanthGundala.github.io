<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="100%" role="img" aria-label="Successes out of 6 trials for each of five layouts, for base, DAgger round 1 and DAgger round 2">
  <style>
    .t { font-family: inherit; fill: var(--text); font-size: 17px; }
    .m { font-family: inherit; fill: var(--text-muted); font-size: 14px; }
    .grid { stroke: var(--border); stroke-width: 1; }
    .link { stroke: var(--border); stroke-width: 2; }
    .base { fill: var(--text-muted); }
    .d1 { fill: var(--accent); }
    .d2 { fill: #d97757; }
    .dot { stroke: var(--bg); stroke-width: 2.5; }
    .v { font-family: inherit; fill: var(--text); font-size: 12px; font-weight: 600; text-anchor: middle; }
  </style>

  <!-- legend -->
  <g>
    <circle class="dot base" cx="262" cy="22" r="8"/><text class="m" x="276" y="27">Base</text>
    <circle class="dot d1" cx="346" cy="22" r="8"/><text class="m" x="360" y="27">DAgger, round 1</text>
    <circle class="dot d2" cx="498" cy="22" r="8"/><text class="m" x="512" y="27">DAgger, round 2</text>
  </g>

  <!-- axis: successes out of 6, x(k) = 260 + 73.33 * k -->
  <g class="grid">
    <line x1="260" y1="50" x2="260" y2="440"/>
    <line x1="333.3" y1="50" x2="333.3" y2="440"/>
    <line x1="406.7" y1="50" x2="406.7" y2="440"/>
    <line x1="480" y1="50" x2="480" y2="440"/>
    <line x1="553.3" y1="50" x2="553.3" y2="440"/>
    <line x1="626.7" y1="50" x2="626.7" y2="440"/>
    <line x1="700" y1="50" x2="700" y2="440"/>
  </g>
  <g class="m" text-anchor="middle">
    <text x="260" y="464">0</text><text x="333.3" y="464">1</text><text x="406.7" y="464">2</text>
    <text x="480" y="464">3</text><text x="553.3" y="464">4</text><text x="626.7" y="464">5</text><text x="700" y="464">6 of 6</text>
  </g>

  <!-- Layout 1: 1, 2, 6 -->
  <text class="t" x="0" y="86">Layout 1</text><text class="m" x="0" y="106">+5 corrections</text>
  <circle class="dot base" cx="333.3" cy="78" r="9"/><circle class="dot d1" cx="406.7" cy="93" r="9"/><circle class="dot d2" cx="700" cy="108" r="9"/>

  <!-- Layout 2: 2, 5, 2 -->
  <text class="t" x="0" y="164">Layout 2</text><text class="m" x="0" y="184">+1 correction</text>
  <circle class="dot base" cx="406.7" cy="156" r="9"/><circle class="dot d1" cx="626.7" cy="171" r="9"/><circle class="dot d2" cx="406.7" cy="186" r="9"/>

  <!-- Layout 3: 5, 3, 3 -->
  <text class="t" x="0" y="242">Layout 3</text><text class="m" x="0" y="262">+3 corrections</text>
  <circle class="dot base" cx="626.7" cy="234" r="9"/><circle class="dot d1" cx="480" cy="249" r="9"/><circle class="dot d2" cx="480" cy="264" r="9"/>

  <!-- Layout 4: 1, 3, 5 -->
  <text class="t" x="0" y="320">Layout 4</text><text class="m" x="0" y="340">+3 corrections</text>
  <circle class="dot base" cx="333.3" cy="312" r="9"/><circle class="dot d1" cx="480" cy="327" r="9"/><circle class="dot d2" cx="626.7" cy="342" r="9"/>

  <!-- Layout 5: 6, 6, 4 -->
  <text class="t" x="0" y="398">Layout 5</text><text class="m" x="0" y="418">no corrections</text>
  <circle class="dot base" cx="700" cy="390" r="9"/><circle class="dot d1" cx="700" cy="405" r="9"/><circle class="dot d2" cx="553.3" cy="420" r="9"/>
</svg>
